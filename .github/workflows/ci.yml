name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    uses: liara-engine/.github/.github/workflows/reusable-build-and-test.yml@v1
    with:
      module: liara-core
      github-repo-version: v1

  lint:
    uses: liara-engine/.github/.github/workflows/reusable-lint.yml@v1
    with:
      module: liara-core
      github-repo-version: v1

  report:
    needs: [ build-and-test, lint ]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: liara-engine/.github/.github/workflows/reusable-ci-report.yml@v1
    with:
      title: 'CI report'
      header: 'ci-report'
      github-repo-version: v1
